---
openapi: 3.1.0
info:
  title: RO-Crate API
  version: 1.0.0-SNAPSHOT
  description: >
    Open Research Data | Measure 2 | API 01<br><br>
    Interoperability between Electronic Laboratory Notebooks and Data Repositories is implemented using <a href="https://www.researchobject.org/ro-crate/"> RO-Crate</a>.<br>
    RO-Crates consumed and produced by this API must comply with this <a href="https://sissource.ethz.ch/sispub/ro-crate/-/blob/main/interoperability/0.1.x/spec.md">profile</a>.<br><br>
    ⚠️ The schemas provided do not reflect the exact structure of the RO-Crate. The JSON-LD document should be flattened.

tags:
  - name: ro-crate

paths:
  /api/v1/ro-crate/import:
    post:
      tags:
        - ro-crate
      requestBody:
        description: <a href="https://www.researchobject.org/ro-crate/specification/1.1/root-data-entity.html#ro-crate-metadata-file-descriptor">RO-Crate Metadata File Descriptor</a>
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/RoCrate"
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Map of the JSON-LD identifiers and associated system identifiers created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
              examples:
                Valid:
                  $ref: "#/components/examples/importResponseExample"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          description: Unacceptable content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
              examples:
                Validation error:
                  $ref: "#/components/examples/validationErrorExample"
                No entity found:
                  $ref: "#/components/examples/emptyCrateExample"
        "500":
          description: Internal server error
      summary: Import RO-Crate
  /api/v1/ro-crate/export:
    post:
      tags:
        - ro-crate
      requestBody:
        description: List of identifiers
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/RoCrate"
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "500":
          description: Internal server error
      summary: Export resources with the given identifiers to a RO-Crate

  /api/v1/ro-crate/validate:
    post:
      tags:
        - ro-crate
      requestBody:
        description: <a href="https://www.researchobject.org/ro-crate/specification/1.1/root-data-entity.html#ro-crate-metadata-file-descriptor">RO-Crate Metadata File Descriptor</a>
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/RoCrate"
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Result of the validation process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
              examples:
                Valid:
                  $ref: "#/components/examples/validCrateResponse"
                Validation error:
                  $ref: "#/components/examples/validationErrorExample"
                No entity found:
                  $ref: "#/components/examples/emptyCrateExample"
        "500":
          description: Internal server error
      summary: Validates a RO-Crate
  /api/v1/publication/validate:
    post:
      tags:
        - scicat
      requestBody:
        description: A single Publication in _unflattened_ form.
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/Publication"
      responses:
        "200":
          description: Result of the validation process
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                if:
                  properties:
                    isValid:
                      const: false
                then:
                  properties:
                    errors:
                      type: array
                      items:
                        $ref: "#/components/schemas/PropertyError"
                  required:
                    - errors
        "500":
          description: Internal server error
        "501":
          description: Not implemented
      summary: Validates a Publication object. The Publication should be flattened before including it in a RO-Crate

# https://github.com/json-ld/json-ld.org/blob/main/schemas/jsonld-schema.json
components:
  schemas:
    RoCrate:
      type: object
      properties:
        "@context":
          type:
            - string
            - array
            - object
            - "null"
        "@graph":
          type: array
          minItems: 2
          items:
            oneOf:
              - $ref: "#/components/schemas/RoCrateMetadata"
              - $ref: "#/components/schemas/RootDataset"
              - $ref: "#/components/schemas/JsonLDEntity"

    RoCrateMetadata:
      type: object
      additionalProperties: true
      properties:
        "@type":
          type: string
          const: "CreativeWork"
        "@id":
          type: string
          const: "ro-crate-metadata.json"
        conformsTo:
          type: object
          properties:
            "@id":
              type: string
              const: "https://w3id.org/ro/crate/1.1"
        about:
          type: object
          properties:
            "@id":
              type: string
              const: "./"
      required:
        - "@type"
        - "@id"
        - conformsTo
        - about

    RootDataset:
      type: object
      additionalProperties: true
      properties:
        "@type":
          type: string
          enum:
            - "Dataset"
        "@id":
          type: string
          enum:
            - "./"
        name:
          type: string
        description:
          type: string
        datePublished:
          type: string
          format: date-time
        license:
          type: object
      required:
        - "@type"
        - "@id"
        - name
        - description
        - datePublished
        - license

    Dataset:
      type: object
      additionalProperties: true
      properties:
        "@type":
          type: string
          const: "Dataset"
        "@id":
          type: string
        name:
          type: string
        dateCreated:
          type: string
          format: date-time
      required:
        - "@id"
        - "@type"
        - name
        - dateCreated

    Publication:
      type: object
      additionalProperties: true
      properties:
        "@type":
          type: string
          const: "CreativeWork"
        "@id":
          type: string
        identifer:
          type: string
        title:
          type: string
        publisher:
          $ref: "#/components/schemas/Organization"
        datePublished:
          type: string
          format: date-time
        creator:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        license:
          type: object
          properties:
            "@id":
              type: string
          required:
            - "@id"
        description:
          type: string
      required:
        - "@id"
        - "@type"
        - identifier
        - title
        - publisher
        - datePublished
        - creator
        - description
        - license

    Person:
      type: object
      additionalProperties: true
      properties:
        "@type":
          type: string
        "@id":
          type: string
        name:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        affiliation:
          $ref: "#/components/schemas/Organization"
      required:
        - "@type"
        - "@id"
        - name
        - givenName
        - familyName

    Organization:
      type: object
      additionalProperties: true
      properties:
        "@type":
          type: string
          const: "Organization"
        "@id":
          type: string
        name:
          type: string
        url:
          type: string
      required:
        - "@type"
        - "@id"
        - name

    JsonLDEntity:
      type: object
      additionalProperties: true
      properties:
        "@type":
          type: string
        "@id":
          type: string
      required:
        - "@type"
        - "@id"

    ImportResponse:
      type: object
      description: Map of JSON-LD identifiers (key) and their corresponding system specific identifiers (value)
      additionalProperties:
        type: string

    ValidationReport:
      type: object
      required:
        - isValid
      properties:
        isValid:
          type: boolean
      if:
        properties:
          isValid:
            const: true
      then:
        properties:
          entities:
            type: array
            items:
              type: string
        required:
          - entities
      else:
        properties:
          errors:
            oneOf:
              - $ref: "#/components/schemas/NoEntityFound"
              - type: array
                items:
                  $ref: "#/components/schemas/ValidationError"

        required:
          - errors

    ValidationError:
      oneOf:
        - $ref: "#/components/schemas/PropertyError"
        - $ref: "#/components/schemas/MissingDataError"

    NoEntityFound:
      type: string
      const: "No suitable entity found in the graph"
      description: The system could not identify any data to import

    MissingDataError:
      type: object
      description: A file or directory was referenced in the ro-crate-metadata.json but is not present in the zip archive. (Can only occur when the RO-Crate is submitted as a zip)
      properties:
        "type":
          type: string
          description: Type of the missing data in RO-Crate vocabulary
          enum:
            - File
            - Dataset
        path:
          description: Path of the missing data inside the zip archive
          type: string
      required:
        - type
        - path

    PropertyError:
      type: object
      properties:
        nodeId:
          type: string
        property:
          type: string
        message:
          type: string
      required:
        - nodeId
        - property
        - message

  examples:
    validCrateResponse:
      value:
        isValid: true
        entities:
          - publication-01
          - dataset-01

    emptyCrateExample:
      value:
        isValid: false
        errors: "No suitable entity found in the graph"

    validationErrorExample:
      value:
        isValid: false
        errors:
          - nodeId: "./"
            property: "http://schema.org/datePublished"
            message: "Cardinality error: expected exactly 1 value"
          - nodeId: "publication_1234"
            property: "http://schema.org/creator"
            message: "Type error: expected 'creator-01' to be a 'http://schema.org/Person' or a 'http://schema.org/Organization' but is a 'http://schema.org/Dataset'"
          - type: File
            path: "./dataset/file-1"

    importResponseExample:
      value:
        publication-01: "10.16907/808de0df-a9d3-4698-8e9f-d6e091516650"
        dataset-01: "20.500.11935/44e91ab9-9ed5-4742-8a73-7834fbd0535e"
